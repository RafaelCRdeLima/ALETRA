<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ÁLETRA</title>
    <meta
      name="description"
      content="Atlas, Lie, Exterior e Transporte de Tangentes em Renderização Animada — geometria diferencial que se lê como contagem."
    />
    <link rel="icon" href="/assets/aletra-icone.svg" />
    <link rel="stylesheet" href="/app/style.css" />
  </head>
  <body>
    <header id="topo">
      <h1 title="Atlas, Lie, Exterior e Transporte de Tangentes em Renderização Animada">
        <!-- alt vazio de propósito: o nome vem do texto ao lado, e um alt aqui
             faria o leitor de tela anunciar "ÁLETRA" duas vezes. -->
        <img src="/assets/aletra-alfa-marca.svg" alt="" />
        <span>ÁLETRA</span>
      </h1>
      <select id="seletor" aria-label="Superfície"></select>
      <select id="modo" aria-label="Leitura">
        <option value="uma">⟨ω, v⟩ — contar folhas</option>
        <option value="duas">(ω∧η)(u, v) — contar células</option>
        <option value="derivada">dω(u, v) — circulação</option>
        <option value="colchete">[X, Y] — o vão dos fluxos</option>
        <option value="holonomia">holonomia — o vetor volta rodado</option>
        <option value="geodesica">geodésica — a linha mais reta</option>
      </select>
      <button id="copiar" type="button">copiar link</button>
      <a id="tutorial" href="./tutorial.html">tutorial</a>
      <div id="numeral" aria-live="polite">
        <span class="numeral-label" id="numeral-label">⟨ω, v⟩</span>
        <span class="numeral-value" id="numeral-value">0,00</span>
        <span class="numeral-gloss" id="numeral-gloss"></span>
      </div>
    </header>

    <main id="paineis">
      <section class="painel" id="painel-carta">
        <h2>Carta</h2>
        <div class="painel-corpo" id="carta-corpo"></div>
      </section>

      <section class="painel" id="painel-mergulho">
        <h2>Mergulho em ℝ³</h2>
        <div class="painel-corpo" id="stage"></div>
        <p class="sem-mergulho" id="sem-mergulho" hidden></p>
      </section>
    </main>

    <aside id="controles">
      <div class="bloco">
        <span class="bloco-titulo">Métrica</span>
        <div id="campos-metrica"></div>
        <p class="erro" id="erro-metrica" hidden></p>
        <p class="aviso" id="aviso-singularidade" hidden></p>
      </div>

      <div class="bloco bloco-vetor">
        <span class="bloco-titulo">Vetor v</span>
        <div id="campos-vetor"></div>
        <p class="derivado" id="v-bemol"></p>
        <label class="morfose">
          <span id="rotulo-bemol">v ⇄ v♭</span>
          <input id="bemol" type="range" min="0" max="1" step="0.01" value="0" />
        </label>
      </div>

      <div class="bloco so-duas-formas">
        <span class="bloco-titulo">Segundo vetor u</span>
        <div id="campos-u"></div>
      </div>

      <div class="bloco so-derivada">
        <span class="bloco-titulo">Campo ω, e a função f</span>
        <div class="campo">
          <span>ω<sub id="sub-campo-0">0</sub> =</span>
          <input id="campo-omega-0" type="text" spellcheck="false" value="-y" />
        </div>
        <div class="campo">
          <span>ω<sub id="sub-campo-1">1</sub> =</span>
          <input id="campo-omega-1" type="text" spellcheck="false" value="x" />
        </div>
        <div class="campo">
          <span>f =</span>
          <input id="campo-f" type="text" spellcheck="false" value="x*y" />
        </div>
        <label class="alternativa">
          <input id="usar-df" type="checkbox" />
          <span>usar ω = df</span>
        </label>
      </div>

      <div class="bloco so-holonomia">
        <span class="bloco-titulo">Transporte</span>
        <label class="morfose">
          <span>posição</span>
          <input id="fase-laco" type="range" min="0" max="1" step="0.002" value="0" />
        </label>
        <label class="alternativa">
          <input id="animar-transporte" type="checkbox" checked />
          <span>andar sozinho</span>
        </label>
        <p class="derivado" id="fase-transporte"></p>
      </div>

      <div class="bloco so-geodesica">
        <span class="bloco-titulo">Geodésica</span>
        <label class="morfose">
          <span>alcance</span>
          <input id="alcance" type="range" min="0.2" max="6" step="0.05" value="3" />
        </label>
        <label class="alternativa">
          <input id="ver-desvio" type="checkbox" checked />
          <span>traçar a vizinha (desvio geodésico)</span>
        </label>
        <p class="derivado" id="parada-geodesica"></p>
      </div>

      <div class="bloco so-colchete">
        <span class="bloco-titulo">Campos X e Y</span>
        <div class="campo">
          <span>X =</span>
          <input id="campo-x-0" type="text" spellcheck="false" value="1" />
          <input id="campo-x-1" type="text" spellcheck="false" value="0" />
        </div>
        <div class="campo">
          <span>Y =</span>
          <input id="campo-y-0" type="text" spellcheck="false" value="0" />
          <input id="campo-y-1" type="text" spellcheck="false" value="x" />
        </div>
        <label class="morfose">
          <span>passo t</span>
          <input id="tempo-fluxo" type="range" min="0.1" max="2" step="0.01" value="1.2" />
        </label>
      </div>

      <div class="bloco so-duas-formas">
        <span class="bloco-titulo">One-form η</span>
        <label>
          <span id="rotulo-eta-0">η₀</span>
          <input id="eta-0" type="range" min="-10" max="10" step="0.1" value="-2.5" />
          <output id="eta-0-out">-2,50</output>
        </label>
        <label>
          <span id="rotulo-eta-1">η₁</span>
          <input id="eta-1" type="range" min="-10" max="10" step="0.1" value="6" />
          <output id="eta-1-out">6,00</output>
        </label>
      </div>

      <div class="bloco bloco-omega">
        <span class="bloco-titulo">One-form ω</span>
        <label>
          <span id="rotulo-omega-0">ω₀</span>
          <input id="omega-0" type="range" min="-10" max="10" step="0.1" value="6" />
          <output id="omega-0-out">6,00</output>
        </label>
        <label>
          <span id="rotulo-omega-1">ω₁</span>
          <input id="omega-1" type="range" min="-10" max="10" step="0.1" value="2.5" />
          <output id="omega-1-out">2,50</output>
        </label>
      </div>

      <p class="nota" id="nota-exemplo"></p>
    </aside>

    <script type="module" src="/app/main.ts"></script>
  </body>
</html>
